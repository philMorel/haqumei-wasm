name: Release

on:
  push:
    tags:
      - "v0.12.0-wasm.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.14.1"
      - name: Verify committed runtime
        run: node scripts/verify-runtime.mjs
      - name: Create GitHub release and upload assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          runtime="runtime/${GITHUB_REF_NAME}"
          test -d "$runtime"
          gh release create "${GITHUB_REF_NAME}" \
            "$runtime/haqumei_wasm_bg.wasm" \
            "$runtime/haqumei_wasm.js" \
            "$runtime/haqumei_wasm.d.ts" \
            "$runtime/haqumei_dictionary_v0.12.0.bin.gz" \
            "$runtime/SHA256SUMS" \
            runtime/manifest.json \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes
