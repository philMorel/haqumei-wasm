[package]
name = "haqumei-wasm"
version = "0.12.0-wasm.1"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
haqumei = { path = "../haqumei", default-features = false, features = ["serde"] }
serde = { workspace = true, features = ["derive"] }
serde-wasm-bindgen = "0.6.5"
wasm-bindgen = "0.2.105"
